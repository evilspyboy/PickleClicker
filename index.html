<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PickleClicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- Start Screen -->
        <!-- Placed at app-container root so it doesn't get clipped by game-area's overflow constraints -->
        <div id="start-screen">
            <img src="assets/title.png" id="start-title" alt="PickleClicker Title">
            <img src="assets/cat_title.png" id="start-cat" alt="Cat">
            <img src="assets/go_button.png" id="start-btn" alt="Go Button">
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden">
            <!-- Header (Biscuits) -->
            <div id="header" class="ui-offscreen-top">
                <img src="assets/biscuit.png" class="biscuit-icon" alt="Biscuit">
                <span id="biscuit-count">0 (x1)</span>
                <span id="reset-icon" title="Reset Progress">&#x21bb;</span>
            </div>

            <!-- Main Game Area -->
            <div id="game-area">
                <div id="background-container">
                    <img src="assets/bg_game.png" id="bg-image" alt="Background">

                    <!-- Stickers Container -->
                    <div id="stickers-container" class="ui-offscreen-bottom">
                        <img src="assets/blanket.png" class="sticker hidden" id="sticker-blanket" data-flip="false" alt="Blanket">
                        <img src="assets/pillow.png" class="sticker hidden" id="sticker-pillow" data-flip="false" alt="Pillow">
                        <img src="assets/spring_toy.png" class="sticker hidden" id="sticker-spring_toy" data-flip="false" alt="Spring Toy">
                        <img src="assets/carboard_box.png" class="sticker hidden" id="sticker-carboard_box" data-flip="false" alt="Cardboard Box">
                        <img src="assets/mouse_toy.png" class="sticker hidden" id="sticker-mouse_toy" data-flip="true" alt="Mouse Toy">
                        <img src="assets/cat_tree.png" class="sticker hidden" id="sticker-cat_tree" data-flip="true" alt="Cat Tree">
                        <img src="assets/motivational_poster.png" class="sticker hidden" id="sticker-motivational_poster" data-flip="false" alt="Motivational Poster">
                    </div>

                    <!-- Cat Container -->
                    <div id="cat-container" class="ui-offscreen-bottom">
                        <img src="assets/cat_rest.png" id="cat-image" data-flip="false" alt="Cat">
                    </div>
                </div>
            </div>

            <!-- Upgrade List -->
            <div id="upgrade-list">
                <!-- Upgrade items will be injected here via JS -->
            </div>

            <div id="settings-area">
                <button id="dev-mode-btn">Developer Mode</button>
            </div>
        </div>

        <!-- Custom Modal Popup (Reset) -->
        <div id="custom-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <p id="custom-modal-message"></p>
                <div class="modal-buttons">
                    <button id="custom-modal-yes" class="modal-btn green-btn">Yes</button>
                    <button id="custom-modal-no" class="modal-btn red-btn">No</button>
                </div>
            </div>
        </div>

        <!-- Instructions Modal -->
        <div id="instructions-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <img src="assets/biscuit.png" class="modal-icon" alt="Biscuit">
                <p>Mr Pickles has a large order of biscuits he needs to make, tap on Mr Pickles to start making biscuits.</p>
                <div class="modal-buttons">
                    <button id="instructions-ok" class="modal-btn green-btn">OK</button>
                </div>
            </div>
        </div>

        <!-- End Game Modal -->
        <div id="endgame-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <img src="assets/chef_hat.png" class="modal-icon" alt="Chef Hat">
                <p>Mr Pickles has made a MILLION biscuits and needs a rest now, you can reset and aim for a better score.</p>
                <div id="leaderboard-container">
                    <h4>Top 5 Scores</h4>
                    <ul id="leaderboard-list">
                        <!-- injected via js -->
                    </ul>
                </div>
                <div class="modal-buttons">
                    <button id="endgame-reset" class="modal-btn red-btn">Reset</button>
                </div>
            </div>
        </div>

        <!-- Dev Mode Panel -->
        <div id="dev-mode-panel" class="hidden">
            <h3>Developer Mode</h3>
            <button id="dev-bg-toggle">Toggle Background</button>
            <div id="dev-controls">
                <p>Selected Element: <span id="dev-selected-sticker">None</span></p>
                <label>Width %: <input type="range" id="dev-scale" min="1" max="100" step="1" value="20"></label><br>
                <label>Z-Index: <input type="number" id="dev-zindex" value="1" style="width: 50px;"></label><br>
                <label>Flip (Mirror): <input type="checkbox" id="dev-flip"></label>
                <div id="dev-output"></div>
            </div>
            <button id="dev-close-btn">Close Dev Mode</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
